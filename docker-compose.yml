services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: abidjan_twin
      POSTGRES_USER: adt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adt_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adt -d abidjan_twin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adt}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-adt_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    environment:
      ADT_DATA_DIR: /app/data/processed
      ADT_MODEL_DIR: /app/ai/traffic/models
      ADT_SUMO_BIN: sumo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./simulation:/app/simulation:ro
      - ./data/processed:/app/data/processed:ro
      - ./ai/traffic/models:/app/ai/traffic/models:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
